server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://35.205.246.86:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  root /usr/share/nginx/html;
  index index.html;

  # Vite writes the bundle under /assets/ with a content hash in every file
  # name, so a file at a given URL never changes: browsers may keep it for a
  # year without asking again. A new deploy ships new names.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html (also served for every SPA route through try_files) and the
  # unhashed files from public/ must be revalidated on every load, otherwise
  # Safari keeps the old entry document under heuristic caching and users run
  # a stale bundle after a deploy. no-cache still allows ETag/304 revalidation.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
